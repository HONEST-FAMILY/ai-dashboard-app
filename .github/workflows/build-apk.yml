name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :app:assembleDebug :wear:assembleDebug :wear:bundleRelease --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ai-dashboard.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk ai-dashboard-watch.apk
          cp wear/build/outputs/bundle/release/wear-release.aab ai-dashboard-watch.aab

      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs ai-dashboard.apk | tee certs.txt
          grep -q "O=Honest Family" certs.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs ai-dashboard-watch.apk | tee wcerts.txt
          grep -q "O=Honest Family" wcerts.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-dashboard-apk
          path: |
            ai-dashboard.apk
            ai-dashboard-watch.apk
            ai-dashboard-watch.aab

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AI 대시보드 앱 (최신 빌드)
          make_latest: true
          body: |
            안드로이드용 AI 대시보드 앱입니다.

            설치 방법 (폰)
            1. 아래 ai-dashboard.apk 를 안드로이드 폰에서 다운로드합니다.
            2. 처음 설치라면 "출처를 알 수 없는 앱 설치"를 허용합니다.
            3. 앱을 열어 평소처럼 로그인하면 됩니다.

            예전 버전에서 처음 올라올 때 한 번만, 기존 앱을 지우고 새로 설치해 주세요(설치가 막히면 지웠다 다시).
            서명 키가 고정되어 있어, 한 번 새로 깐 다음부터는 지울 필요 없이 앱 위에 그대로 업데이트됩니다.

            홈 화면 위젯
            - 홈 화면 빈 곳을 길게 눌러 위젯 > AI 대시보드에서 "스케줄" / "즐겨찾기" 위젯을 추가하고 크기를 조절하세요.
            - 위젯이 비어 있으면 앱을 한 번 열어 로그인한 뒤 위젯의 새로고침을 누르세요.

            갤럭시워치 앱 (ai-dashboard-watch.apk)
            - 갤럭시워치(워치4 이상, Wear OS)용 "시간표" 앱입니다. 현재 시간의 일정과 남은 시간 게이지를 원형 시계처럼 보여줍니다.
            - 폰과 달리 워치는 스토어를 거치지 않고 바로 설치할 수 없어, PC에서 워치로 무선 디버깅으로 한 번 설치해야 합니다(설치 방법은 담당자 안내).
            - 설치 후 폰 앱을 한 번 열어 로그인하면, 워치에 로그인 정보가 자동으로 전달되어 시간표가 뜹니다.

            플레이스토어 등록용 파일 (ai-dashboard-watch.aab)
            - 워치 앱을 구글 플레이 콘솔에 올릴 때 쓰는 업로드 파일입니다(개발자 등록 후 사용).
          files: |
            ai-dashboard.apk
            ai-dashboard-watch.apk
            ai-dashboard-watch.aab
          fail_on_unmatched_files: true
