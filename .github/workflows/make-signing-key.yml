name: Make signing key

on:
  workflow_dispatch:
    inputs:
      password:
        description: Keystore/key password
        required: true

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias dashboard \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "${{ inputs.password }}" \
            -keypass "${{ inputs.password }}" \
            -dname "CN=Honest Family, OU=Dashboard, O=Honest Family, L=Seoul, C=KR"
          base64 -w0 release.jks > release.jks.b64

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            release.jks
            release.jks.b64
