name: 뽀뽀뜨 모바일앱 빌드

on:
  push:
    branches: [main]
    paths:
      - 'popote/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-popote-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: popote-android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: 안드로이드 빌드 도구 준비
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 서명 준비
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: 뽀뽀뜨 앱 빌드와 검증
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle :popote:assembleRelease :popote:lintRelease --no-daemon --stacktrace
      - name: 설치 파일 확인
        run: |
          cp popote/build/outputs/apk/release/popote-release.apk popote-dashboard.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs popote-dashboard.apk | tee certs.txt
          grep -q "O=Honest Family" certs.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging popote-dashboard.apk | tee package.txt
          grep -q "package: name='com.honestfamily.popote'" package.txt
          grep -q "application-label:'뽀뽀뜨 대시보드'" package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: popote-dashboard-apk
          path: popote-dashboard.apk
      - name: 뽀뽀뜨 설치 파일 공개
        uses: softprops/action-gh-release@v2
        with:
          tag_name: popote-latest
          name: 뽀뽀뜨 대시보드 앱
          make_latest: false
          body: |
            뽀뽀뜨 직원용 안드로이드 대시보드입니다.
            설치 파일을 휴대폰에서 내려받아 설치한 뒤 기존 뽀뽀뜨 직원 계정으로 로그인하세요.
            설치 안내: https://popote.honest-family.com/install/mobile
          files: popote-dashboard.apk
          fail_on_unmatched_files: true
