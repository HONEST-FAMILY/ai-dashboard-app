<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스케줄 위젯 미리보기</title>
<style>
  :root{
    --bg:#f6f8f5; --panel:#ffffff; --border:#eaece6; --text:#0f150e;
    --muted:#8b938a; --accent:#02955a; --rose:#b3365c; --out:#c2c7bd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;
    padding:18px 14px 40px;-webkit-text-size-adjust:100%}
  h1{font-size:16px;margin:2px 0 4px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:0 0 16px}
  .frame{max-width:400px;margin:0 auto}
  .card{background:var(--panel);border-radius:22px;padding:12px;
    box-shadow:0 6px 22px rgba(0,0,0,.10);border:1px solid var(--border)}
  .hd{display:flex;align-items:center;gap:2px;padding-bottom:6px}
  .hd .title{flex:1;font-size:15px;font-weight:800;padding-left:2px}
  .chev{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    color:var(--text);font-size:20px;font-weight:700}
  .today{border:1px solid var(--accent);color:var(--accent);font-weight:800;
    font-size:11.5px;border-radius:9px;padding:3px 9px;margin-left:6px}
  .rf{width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:16px;margin-left:4px}
  .wk{display:grid;grid-template-columns:repeat(7,1fr)}
  .wk div{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);
    padding:2px 0 4px}
  .wk .sun{color:var(--rose)} .wk .sat{color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);
    grid-template-rows:repeat(6,1fr);min-height:360px}
  .cell{border-top:1px solid var(--border);padding:3px 2px 0 3px;min-height:60px;overflow:hidden}
  .cell:nth-child(-n+7){border-top:none}
  .dnum{display:inline-flex;min-width:19px;height:19px;align-items:center;
    justify-content:center;font-size:11.5px;padding:0 4px;border-radius:10px}
  .dnum.sun{color:var(--rose)} .dnum.out{color:var(--out)}
  .dnum.today{background:var(--accent);color:#fff;font-weight:800}
  .ev{font-size:10px;line-height:1.35;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;margin-top:1px}
  .ev .bar{font-weight:900;margin-right:1px}
  .more{font-size:10px;color:var(--muted);margin-top:1px}
</style>
</head>
<body>
  <div class="frame">
    <h1>스케줄 위젯 — 새 모습(미리보기)</h1>
    <p class="note">보내주신 캘린더 위젯처럼, 홈 화면에서 한 달을 달력 격자로 보고 각 날짜의 일정을 색 막대와 함께 표시합니다. 아래는 예상 모습입니다(실제 폰 위젯은 크기에 맞춰 자동 조절). 공휴일·음력 표기(추석·개천절 등)는 안드로이드 기본 달력 기능이라 포함되지 않고, 대시보드에 등록한 일정만 나옵니다.</p>
    <div class="card">
      <div class="hd">
        <div class="chev">‹</div>
        <div class="title">2026년 9월</div>
        <div class="chev">›</div>
        <div class="today">오늘</div>
        <div class="rf">⟳</div>
      </div>
      <div class="wk" id="wk"></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
<script>
  const YEAR=2026, MON=9, TODAY="2026-09-13";
  const PAL={1:"var(--text)",2:"#2563EB",3:"#DC2626",4:"#F0E442",5:"#0072B2",6:"#D55E00",7:"#CC79A7",8:"#7C3AED"};
  // 보내주신 화면의 일정들(대시보드 일정만). color = 색 라벨 슬롯.
  const EV={
    "2026-08-31":[{t:"최민준 아들코칭",c:1},{t:"ESG 유지보수",c:5}],
    "2026-09-01":[{t:"서울동행 유지보수",c:5}],
    "2026-09-03":[{t:"애드온즈 배포",c:6}],
    "2026-09-04":[{t:"어큐리티 미팅",c:2}],
    "2026-09-06":[{t:"상위도전학원 미팅",c:8}],
    "2026-09-10":[{t:"스테이앤조이 미팅",c:5}],
    "2026-09-11":[{t:"동국님 저녁",c:1}],
    "2026-09-12":[{t:"큰엄마 생신",c:3}],
    "2026-09-15":[{t:"당근 밋업",c:2},{t:"줌미팅",c:1}],
    "2026-09-24":[{t:"프로니카 구독 해제",c:6}],
    "2026-09-25":[{t:"언더독 10만원 세발",c:2}],
    "2026-10-01":[{t:"서울동행 유지보수",c:5}],
    "2026-10-02":[{t:"하나 vip 카드 해지",c:2}]
  };
  const wkDays=["일","월","화","수","목","금","토"];
  const wk=document.getElementById("wk");
  wkDays.forEach((d,i)=>{const el=document.createElement("div");el.textContent=d;
    if(i===0)el.className="sun"; if(i===6)el.className="sat"; wk.appendChild(el);});
  const pad=n=>String(n).padStart(2,"0");
  const ymd=dt=>`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  const first=new Date(YEAR,MON-1,1);
  const start=new Date(first); start.setDate(1-first.getDay()); // 일요일 시작
  const grid=document.getElementById("grid");
  for(let i=0;i<42;i++){
    const dt=new Date(start); dt.setDate(start.getDate()+i);
    const ds=ymd(dt); const inMon=dt.getMonth()===MON-1;
    const cell=document.createElement("div"); cell.className="cell";
    const dn=document.createElement("span"); dn.className="dnum";
    dn.textContent=dt.getDate();
    if(ds===TODAY)dn.classList.add("today");
    else{ if(!inMon)dn.classList.add("out"); else if(dt.getDay()===0)dn.classList.add("sun"); }
    cell.appendChild(dn);
    const list=EV[ds]||[];
    const show=list.length>3?list.slice(0,2):list;
    show.forEach(e=>{const ev=document.createElement("div"); ev.className="ev";
      const b=document.createElement("span"); b.className="bar";
      b.style.color=PAL[e.c]||"var(--text)"; b.textContent="▍";
      ev.appendChild(b); ev.appendChild(document.createTextNode(e.t)); cell.appendChild(ev);});
    if(list.length>3){const m=document.createElement("div");m.className="more";
      m.textContent="+"+(list.length-2)+"개";cell.appendChild(m);}
    grid.appendChild(cell);
  }
</script>
</body>
</html>
